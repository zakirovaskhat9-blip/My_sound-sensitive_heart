<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my sound-sensitive heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600&display=swap">
<style>
:root{--bg:#f6f3fb;--surf:#fff;--surf2:#ebe5f6;--tx:#1d1830;--mut:#6d6785;--ac:#d6336c;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111f;--surf:#201a31;--surf2:#2b2342;--tx:#f2edff;--mut:#a69fc0;--ac:#ff7aa2;--acx:#2a0a17}}
:root[data-theme="dark"]{--bg:#15111f;--surf:#201a31;--surf2:#2b2342;--tx:#f2edff;--mut:#a69fc0;--ac:#ff7aa2;--acx:#2a0a17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 Manrope,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 8px}
h1{font:600 clamp(13px,4.2vw,20px)/1.3 Unbounded,Manrope,sans-serif;margin:2px 18px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{background:var(--ac);color:var(--acx);font-weight:700;padding:9px 16px;border-radius:99px;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:4px 12px 12px}
#sr{padding:6px 6px 10px}
#q,#nn{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--surf2);background:var(--surf);color:var(--tx);font:inherit}
#plbar{padding:4px 6px 10px;display:flex;gap:8px;align-items:center}
#plbar #nn{flex:1}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;cursor:pointer}
.row.cur{background:var(--surf2)}
.cv{width:46px;height:46px;border-radius:8px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx span{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--mut);flex:none}
.ib.on{color:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:48px 28px}
#mini{margin:0 10px 8px;background:var(--surf);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.14)}
#mini[hidden],#full[hidden],#modal[hidden]{display:none}
#mini .tx{cursor:pointer}
#mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:0}
.pp{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;flex:none}
svg{width:22px;height:22px;fill:currentColor}
nav{display:flex}
nav button{flex:1;padding:12px 0;color:var(--mut);display:grid;place-items:center}
nav button.on{color:var(--ac)}
#full{position:fixed;inset:0;background:transparent;z-index:5;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.fin{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px 26px 22px}
.fin .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.stage{flex:1;display:grid;place-items:center;min-height:0}
.disc{width:min(78vw,340px,42vh);aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#0c0a13 0 3px,#1a1626 3px 5px);box-shadow:0 14px 40px rgba(0,0,0,.35);animation:spin 9s linear infinite;animation-play-state:paused}
.disc.play{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(255,255,255,.12) 25%,transparent 30% 70%,rgba(255,255,255,.1) 75%,transparent 80%)}
.disc i{position:absolute;inset:32%;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:600 28px Unbounded,sans-serif;font-style:normal}
.disc i::after{content:"";position:absolute;width:9%;height:9%;border-radius:50%;background:#0c0a13;inset:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.meta{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.meta .tx b{font-size:20px}
#seek{width:100%;accent-color:var(--ac);margin:8px 0 0}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl .pp{width:64px;height:64px}
.ctl .pp svg{width:30px;height:30px}
.ctl .ib{font-size:22px;color:var(--tx)}
.ctl .ib.on{color:var(--ac)}
#modal{position:fixed;inset:0;z-index:9}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surf);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow-y:auto}
.sh h2{font:600 16px Unbounded,Manrope,sans-serif;margin:0 0 10px}
.opt{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--surf2)}
.opt.danger{color:var(--ac)}
.sh .nw{display:flex;gap:8px;margin-top:12px}
.sh .nw input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--surf2);background:var(--bg);color:var(--tx);font:inherit}
#bgl{position:fixed;inset:-24px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(var(--bl,0px))}
#bgd{position:fixed;inset:0;z-index:0;background:var(--bg);pointer-events:none}
.fp #app{visibility:hidden}
.sl{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;color:var(--mut)}
.sl input{width:100%;accent-color:var(--ac)}
.sh label+h2{margin-top:14px}
.gr{display:flex;gap:10px;margin-bottom:8px}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background-color:var(--surf2);color:var(--tx)}
.sw.on{border-color:var(--ac)}
.nt{color:var(--mut);font-size:13px;margin:8px 0}
#vol{width:100%;accent-color:var(--ac);margin-top:12px}
[hidden]{display:none!important}
#plbar{flex-wrap:wrap}
#plbar .pill{padding:8px 14px}
#plbar #nn{min-width:0}
.pill.alt{background:var(--surf2);color:var(--tx)}
nav svg{width:26px;height:26px}
.gb{width:42px;height:4px;border-radius:2px;background:var(--surf2);margin:0 auto 12px}
.opt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
@keyframes s1{from{transform:translateX(36px);opacity:0}}
@keyframes s2{from{transform:translateX(-36px);opacity:0}}
#main.s1{animation:s1 .2s ease-out}
#main.s2{animation:s2 .2s ease-out}
@media (prefers-reduced-motion:reduce){#main.s1,#main.s2{animation:none}}
.sl.tg{flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:12px}
.sl.tg input{width:24px;height:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:max-content;max-width:88%;background:var(--surf2);color:var(--tx);padding:10px 16px;border-radius:14px;z-index:20;text-align:center;font-size:14px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
html{overflow:hidden;overscroll-behavior:none}
#app{overflow:hidden;touch-action:pan-y}
main{overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
#sr2{display:flex;gap:8px;padding:6px 6px 10px}
#sr2 input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--surf2);background:var(--surf);color:var(--tx);font:inherit}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e10600"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="bgl"></div><div id="bgd"></div>
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('echo.set')||'{}');
  var G=['linear-gradient(160deg,#ff7aa2,#6a4cff)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#f9d976,#f39f86)','linear-gradient(160deg,#1a1626,#4b2e83)'];
  var l=document.getElementById('bgl'),d=document.getElementById('bgd'),img=localStorage.getItem('echo.bgimg'),bg=s.bg||'none';
  l.style.backgroundImage=bg==='img'&&img?'url('+img+')':(bg.charAt(0)==='g'?G[+bg.charAt(1)]:'none');
  l.style.setProperty('--bl',(s.blur==null?6:s.blur)+'px');
  d.style.opacity=(s.dim==null?45:s.dim)/100;
}catch(e){}})();
</script>
<input type="file" id="bgf" accept="image/*" hidden><input type="file" id="cfi" accept=".json,application/json" hidden><input type="file" id="cvf" accept="image/*" hidden>
<div id="app">
  <header><div style="display:flex;align-items:center;gap:10px;min-width:0"><svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width:58px;height:58px;flex:none;border-radius:13px" aria-hidden="true"><defs><radialGradient id="lgbg" cx="50%" cy="42%" r="78%"><stop offset="0" stop-color="#ff4a2e"/><stop offset=".55" stop-color="#e10600"/><stop offset="1" stop-color="#7a0000"/></radialGradient></defs><rect width="512" height="512" fill="url(#lgbg)"/><path d="M298,265 L275,276 L262,305 L242,281 L218,274 L226,250 L227,224 L253,230 L280,214 L281,245 Z" fill="#000"/><path d="M183,279 L152,240 L192,213 L204,167 L250,180 L293,161 L312,204 L355,225 L330,267 L339,313 L295,323 L264,357 L229,326 L179,327 Z" fill="none" stroke="#000" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/><path d="M414,299 L420,371 L351,392 L307,447 L241,424 L174,432 L138,374 L80,338 L88,270 L67,205 L117,158 L143,95 L213,94 L274,57 L327,105 L396,116 L407,186 L454,239 Z" fill="none" stroke="#000" stroke-width="24" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/><path d="M7,324 L-39,251 L14,180 L12,93 L92,60 L140,-10 L224,-1 L302,-30 L368,21 L452,38 L475,121 L539,178 L514,261 L537,344 L468,397 L440,477 L359,493 L293,548 L215,510 L129,522 L84,448 L11,407 Z" fill="none" stroke="#000" stroke-width="26" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/><path d="M19,5 L67,-77 L161,-81 L244,-127 L327,-80 L425,-92 L480,-13 L564,28 L579,121 L633,198 L599,286 L618,380 L547,444 L520,535 L428,560 L361,628 L267,606 L176,634 L103,571 L11,552 L-25,464 L-98,403 L-83,308 L-130,222 L-74,143 L-70,46 Z" fill="none" stroke="#000" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/></svg></div><div style="display:flex;gap:6px;align-items:center"><button class="ib" id="setb" aria-label="Настройки">⚙</button><button class="pill" id="addb">Добавить музыку</button></div></header>
  <h1 id="ttl" hidden></h1>
  <input type="file" id="fi" accept="audio/*" multiple hidden>
  <main id="main">
    <div id="sr"><input id="q" type="search" placeholder="Поиск по названию или исполнителю"></div>
    <div id="sr2" hidden><input id="sq" type="search" placeholder="Название, исполнитель или жанр"><button class="pill" id="sb">Найти</button></div>
    <div id="plbar" hidden></div>
    <div id="list"></div>
  </main>
  <div id="mini" hidden>
    <div class="cv" id="mcv"></div>
    <div class="tx" id="mtx"><b id="mt"></b><span id="ma"></span></div>
    <button class="pp" id="mpp" aria-label="Играть или пауза"></button>
    <button class="ib" id="mnx" aria-label="Следующий">⏭</button>
    <div id="mbar"></div>
  </div>
  <nav id="tabs">
    <button data-t="lib" aria-label="Библиотека"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></button>

    <button data-t="fav" aria-label="Избранное"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg></button>
    <button data-t="search" aria-label="Поиск"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
  </nav>
</div>

<div id="full" hidden>
  <div class="fin">
    <div class="top"><button class="ib" id="fclose" aria-label="Свернуть">⌄</button><span>Сейчас играет</span><span style="width:38px"></span></div>
    <div class="stage"><div class="disc" id="disc"><i id="dl"></i></div></div>
    <div class="meta"><div class="tx"><b id="ft"></b><span id="fa"></span></div><button class="ib" id="fadd" aria-label="В плейлист">＋</button><button class="ib" id="ffav" aria-label="В избранное">♡</button></div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
    <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
    <div class="ctl">
      <button class="ib" id="bsh" aria-label="Перемешать">⇄</button>
      <button class="ib" id="bpv" aria-label="Предыдущий">⏮</button>
      <button class="pp" id="fpp" aria-label="Играть или пауза"></button>
      <button class="ib" id="bnx" aria-label="Следующий">⏭</button>
      <button class="ib" id="brp" aria-label="Повтор">⟳</button>
    </div>
    <input type="range" id="vol" min="0" max="100" aria-label="Громкость">
  </div>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const S={res:[],rmap:{},rq:'',rnote:'',rbusy:false,tracks:[],pls:[],tab:'lib',open:null,queue:[],qi:-1,cur:null,sh:false,rp:0,view:[],drag:false};
const au=$('#au');
let db=null;

/* ---------- хранилище ---------- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('echo',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const dbAll=()=>new Promise(res=>{try{const q=db.transaction('t').objectStore('t').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}});
const dbPut=t=>{try{db&&db.transaction('t','readwrite').objectStore('t').put({id:t.id,blob:t.blob,cover:t.cover,cc:t.cc,rcover:t.remote?t.curl:undefined,remote:t.remote,url:t.remote?t.url:undefined,name:t.name,title:t.title,artist:t.artist,fav:t.fav,added:t.added})}catch(e){}};
const dbDel=id=>{try{db&&db.transaction('t','readwrite').objectStore('t').delete(id)}catch(e){}};
const savePl=()=>{try{localStorage.setItem('echo.pl',JSON.stringify(S.pls))}catch(e){}};
try{S.pls=JSON.parse(localStorage.getItem('echo.pl')||'[]')}catch(e){S.pls=[]}

/* ---------- вспомогательное ---------- */
const T=id=>S.tracks.find(t=>t.id===id)||S.rmap[id];
const grad=t=>{if(t.curl)return 'url('+t.curl+') center/cover no-repeat';let h=0;for(const c of t.name)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h} 75% 62%),hsl(${(h+55)%360} 70% 48%))`};
const fmt=s=>{if(!isFinite(s))return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function parse(file){
  const base=file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const p=base.split(' - ');
  return p.length>1?{artist:p[0].trim(),title:p.slice(1).join(' - ').trim()}:{artist:'',title:base};
}

/* ---------- добавление файлов ---------- */
$('#addb').onclick=()=>$('#fi').click();
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return h>10&&h<20?c:m===1?a:m>1&&m<5?b:c};
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},3500)}
function addFiles(files,quiet){
  const added=[],ids=[];
  files.forEach((f,i)=>{
    const dup=S.tracks.find(x=>x.blob&&x.name===f.name&&x.blob.size===f.size);
    if(dup){ids.push(dup.id);return}
    const m=parse(f);
    const t={id:Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,6),blob:f,name:f.name,title:m.title,artist:m.artist,fav:false,added:Date.now()+i};
    t.url=URL.createObjectURL(f);
    S.tracks.push(t);dbPut(t);coverFor(t);added.push(t);ids.push(t.id);
  });
  render();
  const n=added.length,sk=files.length-n;
  if(n){
    let msg='Добавлено '+n+' '+plural(n,'песня','песни','песен');
    if(sk)msg+=', уже были: '+sk;
    let hints=0;try{hints=+localStorage.getItem('echo.hint')||0}catch(e){}
    if(n===1&&files.length===1&&hints<3&&!quiet){msg+='. Чтобы выбрать сразу несколько, зажми песню пальцем и отметь остальные';try{localStorage.setItem('echo.hint',hints+1)}catch(e){}}
    toast(msg);
  }else if(sk)toast('Эти песни уже есть в библиотеке');
  return ids;
}
$('#fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
window.onNativeIntake=async()=>{
  try{
    const C=window.Capacitor;if(!C||!C.nativePromise)return;
    const r=await C.nativePromise('Intake','take',{});
    if(!r||!r.files||!r.files.length)return;
    const files=[];
    for(const p of r.files){
      try{
        const res=await fetch('/_capacitor_file_'+encodeURI(p));
        const blob=await res.blob();
        const name=p.split('/').pop().replace(/^[0-9]+_/,'');
        files.push(new File([blob],name,{type:blob.type||'audio/mpeg'}));
      }catch(e){}
    }
    if(!files.length)return;
    const ids=addFiles(files);
    if(r.play&&ids.length)play(ids[0],ids);
  }catch(e){}
};

/* ---------- отрисовка ---------- */
function row(t,i){
  return `<div class="row ${S.cur===t.id?'cur':''}" data-i="${i}"><div class="cv" style="--g:${grad(t)}">${t.curl?'':esc((t.title[0]||'♪').toUpperCase())}</div><div class="tx"><b>${esc(t.title)}</b><span>${esc(t.artist||'Неизвестный исполнитель')}</span></div><button class="ib ${t.fav?'on':''}" data-a="fav" data-id="${t.id}" aria-label="В избранное">${t.fav?'♥':'♡'}</button><button class="ib" data-a="more" data-id="${t.id}" aria-label="Ещё">⋯</button></div>`;
}
function render(){
  const t=S.tab,list=$('#list'),bar=$('#plbar');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const pl=S.open&&S.pls.find(p=>p.id===S.open);
  if(S.open&&!pl)S.open=null;
  const tt=$('#ttl');tt.hidden=false;tt.textContent=t==='lib'?'my sound-sensitive heart':t==='fav'?'Избранное':t==='search'?'Поиск':(pl?pl.name:'Плейлисты');
  $('#sr').hidden=t!=='lib';$('#sr2').hidden=t!=='search';
  bar.hidden=t!=='pl';if(t!=='pl')setBar('','');
  let ids=[],html='',pre='';
  if(t==='lib'){
    const q=$('#q').value.trim().toLowerCase();
    ids=S.tracks.slice().sort((a,b)=>b.added-a.added).filter(x=>!q||(x.title+' '+x.artist).toLowerCase().includes(q)).map(x=>x.id);
    if(!S.tracks.length)html='';

  }else if(!pl){
    setBar('root','<input id="nn" placeholder="Название нового плейлиста"><button class="pill" id="mk">Создать</button>');
    html=S.pls.length?S.pls.map(p=>`<div class="row" data-p="${p.id}"><div class="cv" style="--g:${grad({name:p.name})}">${esc(p.name[0].toUpperCase())}</div><div class="tx"><b>${esc(p.name)}</b><span>Песен: ${p.ids.filter(T).length}</span></div></div>`).join(''):'<div class="empty">Создайте первый плейлист и добавляйте в него песни через меню ⋯</div>';
  }else{

  }
  S.view=ids;

}

function play(id,list){

function step(d,auto){
  if(!S.queue.length)return;
  let n;
  if(S.sh&&S.queue.length>1){do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi)}
  else{
    n=S.qi+d;
    if(n>=S.queue.length){
      if(S.rp===1||!auto)n=0;else{au.pause();au.currentTime=0;return}
    }
    if(n<0)n=S.queue.length-1;
  }
  play(S.queue[n]);
}
const prev=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};

function mediaSession(t){

}

const G=['linear-gradient(160deg,#ff7aa2,#6a4cff)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#f9d976,#f39f86)','linear-gradient(160deg,#1a1626,#4b2e83)'];

function toDataUrl(blob,max){max=max||1280;return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(blob);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
const saveSet=()=>{try{localStorage.setItem('echo.set',JSON.stringify(SET))}catch(e){}};
const layers=[];
function pushLayer(n){try{history.pushState({l:n},'');layers.push(n)}catch(e){}}
function hideLayer(n){
  if(n==='modal')$('#modal').hidden=true;
  if(n==='full'){$('#full').hidden=true;document.body.classList.remove('fp')}
}
function closeLayer(n){
  const i=layers.lastIndexOf(n);
  if(i<0){hideLayer(n);return}
  if(i===layers.length-1)history.back();
  else{layers.splice(i,1);hideLayer(n)}
}
addEventListener('popstate',()=>{const n=layers.pop();if(n)hideLayer(n)});
const closeModal=()=>closeLayer('modal');
const fullShow=v=>{
  if(v){if(!$('#full').hidden)return;$('#full').hidden=false;document.body.classList.add('fp');pushLayer('full')}

function setBar(m,h){const b=$('#plbar');if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=h}}
const TABS=['lib','pl','fav','search'];
function go(t,dir){
  if(dir===undefined)dir=Math.sign(TABS.indexOf(t)-TABS.indexOf(S.tab));
  S.tab=t;S.open=null;render();
  const m=$('#main');m.scrollTop=0;
  if(dir)slideAnim(dir);
}
function slideAnim(dir){const m=$('#main');m.classList.remove('s1','s2');void m.offsetWidth;m.classList.add(dir>0?'s1':'s2')}
(()=>{
  const m=$('#main');
  let sx=0,sy=0,lx=0,lt=0,v=0,mode=0,ok=false;
  const canGo=d=>{if(S.tab==='pl'&&S.open&&d<0)return true;const n=TABS.indexOf(S.tab)+d;return n>=0&&n<TABS.length};
  const reset=()=>{m.style.transition='transform .18s ease-out';m.style.transform=''};
  m.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ok=false;return}
    const t=e.touches[0];sx=lx=t.clientX;sy=t.clientY;lt=e.timeStamp;v=0;mode=0;
    ok=!e.target.closest('input');m.style.transition='none';
  },{passive:true});
  m.addEventListener('touchmove',e=>{
    if(!ok)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(mode===0){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      mode=Math.abs(dx)>Math.abs(dy)*1.05?1:2;
    }
    if(mode!==1)return;
    const dt=e.timeStamp-lt;if(dt>0){v=(t.clientX-lx)/dt;lx=t.clientX;lt=e.timeStamp}
    m.style.transform='translateX('+(canGo(dx<0?1:-1)?dx*0.9:dx*0.25)+'px)';
  },{passive:true});
  m.addEventListener('touchend',e=>{
    if(!ok||mode!==1){ok=false;reset();return}
    ok=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,d=dx<0?1:-1;
    const fast=Math.abs(v)>0.35&&Math.abs(dx)>14&&(v<0)===(dx<0);
    if(canGo(d)&&(Math.abs(dx)>38||fast)){
      m.style.transition='none';m.style.transform='';
      if(S.tab==='pl'&&S.open&&d<0){S.open=null;render();slideAnim(d)}
      else go(TABS[TABS.indexOf(S.tab)+d],d);
    }else reset();
  },{passive:true});
  m.addEventListener('touchcancel',()=>{ok=false;reset()},{passive:true});
})();
function swipeDown(target,getEl,close,can){
  let y0=null,dy=0;
  target.addEventListener('touchstart',e=>{y0=(e.target.closest('input')||!can(e))?null:e.touches[0].clientY;dy=0},{passive:true});
  target.addEventListener('touchmove',e=>{
    if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);
    const el=getEl();if(el){el.style.transition='none';el.style.transform='translateY('+dy+'px)'}
  },{passive:true});
  target.addEventListener('touchend',e=>{
    if(y0===null)return;
    const c=e.changedTouches&&e.changedTouches[0];if(c)dy=Math.max(dy,c.clientY-y0);
    y0=null;
    const el=getEl();if(el){el.style.transition='transform .2s';el.style.transform=''}
    if(dy>110)close();
  },{passive:true});
}
swipeDown($('#modal'),()=>$('#modal .sh'),closeModal,e=>{const sh=e.target.closest('.sh');return !!sh&&sh.scrollTop===0});
swipeDown($('#full'),()=>$('#full .fin'),()=>fullShow(false),()=>true);

/* ---------- каталог дистрибьютора ---------- */
const isUrl=u=>u.startsWith('https://')||u.startsWith('http://');
const cid=s=>[...String(s)].map(c=>/[a-z0-9-]/i.test(c)?c:'_').join('').slice(-40);
const say=t=>{const p=$('#cm');if(p)p.textContent=t};
function importFeed(j){
  const arr=Array.isArray(j)?j:j.tracks;
  if(!Array.isArray(arr))throw new Error('feed');
  let n=0;
  arr.forEach((x,i)=>{
    const url=String(x.url||x.audio||x.file||'');
    if(!isUrl(url))return;
    const title=String(x.title||x.name||'Без названия');
    const id='r-'+cid(x.id||url);
    if(T(id))return;
    const t={id,remote:true,url,name:title,title,artist:String(x.artist||''),fav:false,added:Date.now()+i};
    const cov=String(x.cover||x.image||'');if(isUrl(cov))t.curl=cov;
    S.tracks.push(t);dbPut(t);n++;
  });
  say('Добавлено треков: '+n);render();
}
$('#cfi').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{importFeed(JSON.parse(await f.text()))}catch(x){say('Файл не похож на каталог треков.')}
};
function catalog(){
  const m=sheet(`<h2>Каталог дистрибьютора</h2><p class='nt'>Загрузите ленту треков от дистрибьютора: JSON по ссылке или файлом. Только музыка, на которую у вас есть права.</p><div class='nw'><input id='cu' placeholder='https://…/catalog.json' value='${esc(SET.feed||'')}'><button class='pill' id='cg'>Загрузить</button></div><button class='opt' id='cf'>Открыть файл каталога</button><p class='nt' id='cm'></p>`);
  m.onclick=async e=>{
    if(e.target.id==='cf')$('#cfi').click();
    if(e.target.id==='cg'){
      const u=$('#cu').value.trim();
      if(!isUrl(u))return say('Вставьте ссылку, которая начинается с https://');
      try{const r=await fetch(u);importFeed(await r.json());SET.feed=u;saveSet()}catch(x){say('Не удалось загрузить по ссылке. Откройте файл каталога вручную.')}
    }
  };
}

/* ---------- обложки из файлов (MP3, FLAC, M4A) ---------- */
const rd=async(f,o,l)=>new Uint8Array(await f.slice(o,o+l).arrayBuffer());
const u32=(b,o)=>((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
function imgBlob(img){
  if(!img||img.length<100)return null;
  const jpg=img[0]===0xFF&&img[1]===0xD8,png=img[0]===0x89&&img[1]===0x50,gif=img[0]===0x47&&img[1]===0x49,webp=img[0]===0x52&&img[8]===0x57;
  if(!jpg&&!png&&!gif&&!webp)return null;
  return new Blob([img],{type:jpg?'image/jpeg':png?'image/png':gif?'image/gif':'image/webp'});
}
function deunsync(a){const o=[];for(let i=0;i<a.length;i++){o.push(a[i]);if(a[i]===0xFF&&a[i+1]===0)i++}return Uint8Array.from(o)}
async function id3Cover(file,head){
  const ver=head[3],flags=head[5];
  const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
  let b=await rd(file,10,size);
  if((flags&0x80)&&ver<4)b=deunsync(b);
  let p=0;
  if(flags&0x40)p=ver===4?((b[0]<<21)|(b[1]<<14)|(b[2]<<7)|b[3]):u32(b,0)+4;
  const idLen=ver===2?3:4,hl=ver===2?6:10;
  while(p+hl<=b.length){
    const id=String.fromCharCode(...b.slice(p,p+idLen));
    if(!/^[A-Z0-9]+$/.test(id))break;
    let fs;
    if(ver===2)fs=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];
    else if(ver===4)fs=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];
    else fs=u32(b,p+4);
    if(fs<=0||p+hl+fs>b.length)break;
    if(id==='APIC'||id==='PIC'){
      let fd=b.subarray(p+hl,p+hl+fs);
      if(ver===4){const f2=b[p+9];if(f2&2)fd=deunsync(fd);if(f2&1)fd=fd.subarray(4)}
      const enc=fd[0];let q=1;
      if(ver===2)q+=3;else{while(q<fd.length&&fd[q]!==0)q++;q++}
      q++;
      if(enc===1||enc===2){while(q+1<fd.length&&!(fd[q]===0&&fd[q+1]===0))q+=2;q+=2}
      else{while(q<fd.length&&fd[q]!==0)q++;q++}
      return imgBlob(fd.subarray(q));
    }
    p+=hl+fs;
  }
  return null;
}
async function flacCover(file){
  let off=4;
  for(let i=0;i<64;i++){
    const h=await rd(file,off,4);if(h.length<4)return null;
    const last=h[0]&0x80,type=h[0]&0x7F,len=(h[1]<<16)|(h[2]<<8)|h[3];
    if(type===6){
      const b=await rd(file,off+4,len);
      let q=4;q+=4+u32(b,q);q+=4+u32(b,q);q+=16;
      const n=u32(b,q);q+=4;
      return imgBlob(b.subarray(q,q+n));
    }
    off+=4+len;if(last)break;
  }
  return null;
}
async function mp4Cover(file){
  async function find(start,end,name){
    let off=start;
    while(off+8<=end){
      const h=await rd(file,off,16);
      let size=u32(h,0),hdr=8;
      const type=String.fromCharCode(h[4],h[5],h[6],h[7]);
      if(size===1){size=u32(h,12);hdr=16}else if(size===0)size=end-off;
      if(size<hdr)return null;
      if(type===name)return {off:off+hdr,end:off+size};
      off+=size;
    }
    return null;
  }
  let a=await find(0,file.size,'moov');if(!a)return null;
  a=await find(a.off,a.end,'udta');if(!a)return null;
  a=await find(a.off,a.end,'meta');if(!a)return null;
  a=await find(a.off+4,a.end,'ilst');if(!a)return null;
  a=await find(a.off,a.end,'covr');if(!a)return null;
  a=await find(a.off,a.end,'data');if(!a)return null;
  return imgBlob(await rd(file,a.off+8,a.end-a.off-8));
}
async function extractCover(file){
  try{
    const h=await rd(file,0,12);
    if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33)return await id3Cover(file,h);
    if(String.fromCharCode(h[0],h[1],h[2],h[3])==='fLaC')return await flacCover(file);
    if(String.fromCharCode(h[4],h[5],h[6],h[7])==='ftyp')return await mp4Cover(file);
  }catch(e){}
  return null;
}
function coverFor(t){
  extractCover(t.blob).then(c=>{
    t.cc=2;
    if(c){t.cover=c;t.curl=URL.createObjectURL(c)}
    dbPut(t);render();ui();if(SET.dyn)applySet();
  });
}
$('#cvf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  const t=T(S.covFor);if(!f||!t)return;
  if(t.curl&&!t.remote)URL.revokeObjectURL(t.curl);
  t.cover=f;t.curl=URL.createObjectURL(f);t.cc=2;
  dbPut(t);render();ui();if(SET.dyn)applySet();toast('Обложка установлена');
};

/* ---------- поиск: каталог Jamendo (музыка под лицензиями Creative Commons) ---------- */
const jmKey=()=>String(SET.jm||JM_DEFAULT||'').trim();
const bad=u=>[...u].some(c=>' ()\'"<>'.includes(c));
const goodUrl=u=>typeof u==='string'&&isUrl(u)&&!bad(u);
const licName=u=>{const m=String(u||'').split('/licenses/')[1];return m?'CC '+m.split('/')[0].toUpperCase():'CC'};
async function jm(path,p){
  const u=new URL('https://api.jamendo.com/v3.0/'+path+'/');
  const q=Object.assign({client_id:jmKey(),format:'json',limit:30,include:'musicinfo',imagesize:200,audioformat:'mp32'},p);
  Object.keys(q).forEach(k=>u.searchParams.set(k,q[k]));
  const r=await fetch(u.toString());const j=await r.json();
  if(j.headers&&j.headers.status&&j.headers.status!=='success')throw new Error(j.headers.error_message||'api');
  return j.results||[];
}
function addRes(list){
  S.res=list.filter(r=>goodUrl(r.audio)).map(r=>{
    const id='j'+r.id,tg=(r.musicinfo&&r.musicinfo.tags)||{};
    const img=r.album_image||r.image||'';
    S.rmap[id]={id,tmp:true,remote:true,url:r.audio,dl:goodUrl(r.audiodownload)?r.audiodownload:'',dlok:r.audiodownload_allowed!==false,name:String(r.name),title:String(r.name),artist:String(r.artist_name||''),curl:goodUrl(img)?img:'',lic:licName(r.license_ccurl),share:goodUrl(r.shareurl)?r.shareurl:'',tags:[].concat(tg.genres||[],tg.vartags||[]).slice(0,4),fav:false,added:Date.now()};
    return id;
  });
}
function rrow(t,i){
  return `<div class="row ${S.cur===t.id?'cur':''}" data-i="${i}"><div class="cv" style="--g:${grad(t)}">${t.curl?'':'♪'}</div><div class="tx"><b>${esc(t.title)}</b><span>${esc(t.artist)}${t.lic?' · '+esc(t.lic):''}</span></div><button class="ib" data-a="sim" data-id="${t.id}" aria-label="Похожие">≈</button><button class="ib" data-a="sv" data-id="${t.id}" aria-label="Сохранить в библиотеку">⤓</button></div>`;
}
async function doSearch(q){
  q=String(q||'').trim();if(!q||!jmKey())return;
  S.rq=q;S.rbusy=true;S.rnote='';S.res=[];render();
  try{
    let list=await jm('tracks',{search:q}),note='';
    const w=q.split(' ').filter(Boolean);
    if(!list.length&&w.length>1)list=await jm('tracks',{search:w[0]});
    if(!list.length){list=await jm('tracks',{fuzzytags:w.join(' '),order:'popularity_total'})}
    if(!list.length)S.rnote='Ничего не нашлось. Попробуй другое название или жанр.';
    else if(!(list[0].name||'').toLowerCase().includes(q.toLowerCase()))note='Точной песни нет, вот похожие';
    S.rnote=S.rnote||note;
    addRes(list);
  }catch(e){S.rnote='Не удалось выполнить поиск. Проверь интернет и ключ Jamendo в настройках.';S.res=[]}
  S.rbusy=false;render();
}
async function similar(t){
  if(!t)return;
  S.rq='sim';S.rbusy=true;S.rnote='';render();
  try{
    const list=await jm('tracks',t.tags&&t.tags.length?{fuzzytags:t.tags.join(' '),order:'popularity_total'}:{search:t.artist||t.title});
    addRes(list.filter(x=>'j'+x.id!==t.id));
    S.rnote='Похожие на «'+t.title+'»';
    if(!S.res.length)S.rnote='Похожих песен не нашлось.';
  }catch(e){S.rnote='Не удалось найти похожие. Проверь интернет и ключ Jamendo.';S.res=[]}
  S.rbusy=false;render();
}
async function getBlob(url){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.nativePromise){
    const r=await C.nativePromise('CapacitorHttp','request',{url,method:'GET',responseType:'blob',headers:{}});
    const bin=atob(r.data),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:'audio/mpeg'});
  }
  const r=await fetch(url);if(!r.ok)throw new Error('http');return await r.blob();
}
async function saveRemote(t){
  if(!t)return;
  if(!t.dlok||!(t.dl||t.url)){toast('Автор не разрешил скачивание этой песни');return}
  toast('Скачиваю…');
  try{
    const blob=await getBlob(t.dl||t.url);
    const nm=[...((t.artist?t.artist+' - ':'')+t.title+'.mp3')].map(c=>'/:*?"<>|'.includes(c)?'_':c).join('');
    addFiles([new File([blob],nm,{type:'audio/mpeg'})],true);
  }catch(e){
    toast('Не удалось скачать. Открываю страницу песни');
    if(t.share)window.open(t.share,'_blank');
  }
}
$('#sb').onclick=()=>doSearch($('#sq').value);
$('#sq').onkeydown=e=>{if(e.key==='Enter')doSearch(e.target.value)};

    all.forEach(r=>{if(r.id==='bg'){if(SET.bg==='img'&&!bgUrl){bgUrl=URL.createObjectURL(r.blob);toDataUrl(r.blob).then(u=>{if(u){try{localStorage.setItem('echo.bgimg',u)}catch(x){}}})}return}if(!r.remote)r.url=URL.createObjectURL(r.blob);if(r.cover)r.curl=URL.createObjectURL(r.cover);else if(r.remote&&r.rcover)r.curl=r.rcover;S.tracks.push(r)})}catch(e){db=null}
  if(SET.bg==='img'&&!bgUrl)SET.bg='none';
  applySet();
  S.tracks.filter(t=>!t.remote&&t.cc!==2&&t.blob).forEach(coverFor);

  if(window.onNativeIntake)window.onNativeIntake();
})();
