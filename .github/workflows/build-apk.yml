name: Build APK
concurrency:
  group: build-apk
  cancel-in-progress: true
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        run: |
          missing=0
          for f in package.json capacitor.config.json www/index.html native/MainActivity.java native/IntakePlugin.java native/MusicPlugin.java native/patch_manifest.py debug.keystore assets/icon-only.png assets/splash.png; do
            if [ ! -f "$f" ]; then
              echo "::error::НЕТ ФАЙЛА В РЕПОЗИТОРИИ: $f (загрузи его, смотри README.txt)"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Add Android project
        run: npx cap add android
      - name: Add open and share audio support
        run: |
          cp native/*.java android/app/src/main/java/app/soundheart/player/
          python3 native/patch_manifest.py
      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#e10600' --iconBackgroundColorDark '#e10600' --splashBackgroundColor '#e10600' --splashBackgroundColorDark '#e10600'
        continue-on-error: true
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --build-cache -Dorg.gradle.jvmargs=-Xmx2g
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-sound-sensitive-heart-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
