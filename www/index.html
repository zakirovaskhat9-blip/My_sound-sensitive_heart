<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my sound-sensitive heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600&display=swap">
<style>
:root{--bg:#f6f3fb;--surf:#fff;--surf2:#ebe5f6;--tx:#1d1830;--mut:#6d6785;--ac:#d6336c;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111f;--surf:#201a31;--surf2:#2b2342;--tx:#f2edff;--mut:#a69fc0;--ac:#ff7aa2;--acx:#2a0a17}}
:root[data-theme="dark"]{--bg:#15111f;--surf:#201a31;--surf2:#2b2342;--tx:#f2edff;--mut:#a69fc0;--ac:#ff7aa2;--acx:#2a0a17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 Manrope,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 8px}
h1{font:600 20px/1.3 Unbounded,Manrope,sans-serif;margin:2px 18px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{background:var(--ac);color:var(--acx);font-weight:700;padding:9px 16px;border-radius:99px;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:4px 12px 12px}
#sr{padding:6px 6px 10px}
#q,#nn{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--surf2);background:var(--surf);color:var(--tx);font:inherit}
#plbar{padding:4px 6px 10px;display:flex;gap:8px;align-items:center}
#plbar #nn{flex:1}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;cursor:pointer}
.row.cur{background:var(--surf2)}
.cv{width:46px;height:46px;border-radius:8px;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:700;flex:none;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx span{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--mut);flex:none}
.ib.on{color:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:48px 28px}
#mini{margin:0 10px 8px;background:var(--surf);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.14)}
#mini[hidden],#full[hidden],#modal[hidden]{display:none}
#mini .tx{cursor:pointer}
#mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:0}
.pp{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;flex:none}
svg{width:22px;height:22px;fill:currentColor}
nav{display:flex;border-top:1px solid var(--surf2)}
nav button{flex:1;padding:12px 0;color:var(--mut);display:grid;place-items:center}
nav button.on{color:var(--ac)}
#full{position:fixed;inset:0;background:transparent;z-index:5;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.fin{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px 26px 22px}
.fin .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.stage{flex:1;display:grid;place-items:center;min-height:0}
.disc{width:min(78vw,340px,42vh);aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#0c0a13 0 3px,#1a1626 3px 5px);box-shadow:0 14px 40px rgba(0,0,0,.35);animation:spin 9s linear infinite;animation-play-state:paused}
.disc.play{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(255,255,255,.12) 25%,transparent 30% 70%,rgba(255,255,255,.1) 75%,transparent 80%)}
.disc i{position:absolute;inset:32%;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:600 28px Unbounded,sans-serif;font-style:normal}
.disc i::after{content:"";position:absolute;width:9%;height:9%;border-radius:50%;background:#0c0a13;inset:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.meta{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.meta .tx b{font-size:20px}
#seek{width:100%;accent-color:var(--ac);margin:8px 0 0}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl .pp{width:64px;height:64px}
.ctl .pp svg{width:30px;height:30px}
.ctl .ib{font-size:22px;color:var(--tx)}
.ctl .ib.on{color:var(--ac)}
#modal{position:fixed;inset:0;z-index:9}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surf);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow-y:auto}
.sh h2{font:600 16px Unbounded,Manrope,sans-serif;margin:0 0 10px}
.opt{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--surf2)}
.opt.danger{color:var(--ac)}
.sh .nw{display:flex;gap:8px;margin-top:12px}
.sh .nw input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--surf2);background:var(--bg);color:var(--tx);font:inherit}
#bgl{position:fixed;inset:-24px;z-index:0;background:var(--bg) center/cover no-repeat;filter:blur(var(--bl,0px))}
#bgd{position:fixed;inset:0;z-index:0;background:var(--bg);pointer-events:none}
.fp #app{visibility:hidden}
.sl{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;color:var(--mut)}
.sl input{width:100%;accent-color:var(--ac)}
.sh label+h2{margin-top:14px}
.gr{display:flex;gap:10px;margin-bottom:8px}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background-color:var(--surf2);color:var(--tx)}
.sw.on{border-color:var(--ac)}
.nt{color:var(--mut);font-size:13px;margin:8px 0}
#vol{width:100%;accent-color:var(--ac);margin-top:12px}
[hidden]{display:none!important}
#plbar{flex-wrap:wrap}
#plbar .pill{padding:8px 14px}
#plbar #nn{min-width:0}
.pill.alt{background:var(--surf2);color:var(--tx)}
nav svg{width:26px;height:26px}
.gb{width:42px;height:4px;border-radius:2px;background:var(--surf2);margin:0 auto 12px}
.opt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
@keyframes s1{from{transform:translateX(36px);opacity:0}}
@keyframes s2{from{transform:translateX(-36px);opacity:0}}
#main.s1{animation:s1 .2s ease-out}
#main.s2{animation:s2 .2s ease-out}
@media (prefers-reduced-motion:reduce){#main.s1,#main.s2{animation:none}}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e10600"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="bgl"></div><div id="bgd"></div>
<input type="file" id="bgf" accept="image/*" hidden><input type="file" id="cfi" accept=".json,application/json" hidden>
<div id="app">
  <header><div style="display:flex;align-items:center;gap:10px;min-width:0"><svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width:58px;height:58px;flex:none;border-radius:13px" aria-hidden="true"><rect width="512" height="512" fill="#e10600"/><path fill="#000" fill-rule="evenodd" d="M275,56 L255,58 L249,75 L243,65 L237,62 L216,69 L212,75 L214,88 L203,96 L196,86 L186,82 L172,82 L160,87 L150,79 L141,77 L129,83 L119,96 L117,107 L129,128 L132,145 L119,173 L111,204 L111,226 L115,240 L114,281 L116,300 L126,337 L140,364 L160,392 L191,421 L222,442 L253,456 L271,453 L286,446 L314,425 L344,388 L371,342 L382,310 L386,282 L382,264 L375,251 L379,240 L379,224 L363,185 L374,173 L396,156 L401,146 L397,125 L383,104 L374,100 L364,100 L339,112 L330,113 L316,101 L322,80 L320,71 L299,63 L287,71 L284,60 Z M345,186 L348,195 L325,210 L310,225 L302,238 L301,247 L314,254 L357,249 L360,258 L333,264 L302,262 L300,285 L326,297 L347,318 L347,323 L341,327 L325,312 L318,336 L311,339 L309,331 L315,304 L297,297 L282,330 L279,363 L308,383 L311,388 L305,392 L278,377 L275,406 L267,411 L264,404 L270,341 L246,354 L238,382 L234,385 L228,381 L233,356 L243,343 L267,329 L277,317 L288,287 L290,242 L298,222 L317,203 Z M365,116 L371,117 L375,132 L383,144 L377,150 L372,147 L364,132 L361,119 Z M314,119 L320,126 L307,131 L265,122 L249,127 L245,134 L244,158 L221,173 L204,198 L231,234 L242,255 L243,279 L240,295 L236,302 L229,298 L233,272 L230,254 L215,230 L193,205 L178,200 L162,203 L146,213 L132,230 L128,231 L127,219 L142,202 L158,192 L180,189 L174,173 L174,157 L179,141 L191,126 L193,111 L203,114 L202,130 L190,144 L185,158 L186,174 L194,189 L213,165 L234,154 L236,129 L245,117 L258,112 L269,112 L299,120 Z M183,98 L188,105 L171,108 L170,137 L167,141 L163,141 L160,138 L159,104 L175,97 Z M147,97 L153,103 L141,114 L136,106 Z"/></svg></div><div style="display:flex;gap:6px;align-items:center"><button class="ib" id="setb" aria-label="Настройки">⚙</button><button class="pill" id="addb">Добавить музыку</button></div></header>
  <h1 id="ttl" hidden></h1>
  <input type="file" id="fi" accept="audio/*" multiple hidden>
  <main id="main">
    <div id="sr"><input id="q" type="search" placeholder="Поиск по названию или исполнителю"></div>
    <div id="plbar" hidden></div>
    <div id="list"></div>
  </main>
  <div id="mini" hidden>
    <div class="cv" id="mcv"></div>
    <div class="tx" id="mtx"><b id="mt"></b><span id="ma"></span></div>
    <button class="pp" id="mpp" aria-label="Играть или пауза"></button>
    <button class="ib" id="mnx" aria-label="Следующий">⏭</button>
    <div id="mbar"></div>
  </div>
  <nav id="tabs">
    <button data-t="lib" aria-label="Библиотека"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></button>
    <button data-t="pl" aria-label="Плейлисты"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zM3 11h12v2H3zM3 16h7v2H3zM17 10v6.3A2.5 2.5 0 1 0 19 18.7V12h3v-2z"/></svg></button>
    <button data-t="fav" aria-label="Избранное"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg></button>
  </nav>
</div>

<div id="full" hidden>
  <div class="fin">
    <div class="top"><button class="ib" id="fclose" aria-label="Свернуть">⌄</button><span>Сейчас играет</span><span style="width:38px"></span></div>
    <div class="stage"><div class="disc" id="disc"><i id="dl"></i></div></div>
    <div class="meta"><div class="tx"><b id="ft"></b><span id="fa"></span></div><button class="ib" id="fadd" aria-label="В плейлист">＋</button><button class="ib" id="ffav" aria-label="В избранное">♡</button></div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
    <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
    <div class="ctl">
      <button class="ib" id="bsh" aria-label="Перемешать">⇄</button>
      <button class="ib" id="bpv" aria-label="Предыдущий">⏮</button>
      <button class="pp" id="fpp" aria-label="Играть или пауза"></button>
      <button class="ib" id="bnx" aria-label="Следующий">⏭</button>
      <button class="ib" id="brp" aria-label="Повтор">⟳</button>
    </div>
    <input type="range" id="vol" min="0" max="100" aria-label="Громкость">
  </div>
</div>
<div id="modal" hidden></div>
<audio id="au" preload="metadata"></audio>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const S={tracks:[],pls:[],tab:'lib',open:null,queue:[],qi:-1,cur:null,sh:false,rp:0,view:[],drag:false};
const au=$('#au');
let db=null;

/* ---------- хранилище ---------- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('echo',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const dbAll=()=>new Promise(res=>{try{const q=db.transaction('t').objectStore('t').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}});
const dbPut=t=>{try{db&&db.transaction('t','readwrite').objectStore('t').put({id:t.id,blob:t.blob,remote:t.remote,url:t.remote?t.url:undefined,name:t.name,title:t.title,artist:t.artist,fav:t.fav,added:t.added})}catch(e){}};
const dbDel=id=>{try{db&&db.transaction('t','readwrite').objectStore('t').delete(id)}catch(e){}};
const savePl=()=>{try{localStorage.setItem('echo.pl',JSON.stringify(S.pls))}catch(e){}};
try{S.pls=JSON.parse(localStorage.getItem('echo.pl')||'[]')}catch(e){S.pls=[]}

/* ---------- вспомогательное ---------- */
const T=id=>S.tracks.find(t=>t.id===id);
const grad=t=>{let h=0;for(const c of t.name)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h} 75% 62%),hsl(${(h+55)%360} 70% 48%))`};
const fmt=s=>{if(!isFinite(s))return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function parse(file){
  const base=file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const p=base.split(' - ');
  return p.length>1?{artist:p[0].trim(),title:p.slice(1).join(' - ').trim()}:{artist:'',title:base};
}

/* ---------- добавление файлов ---------- */
$('#addb').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{
  const files=[...e.target.files];
  files.forEach((f,i)=>{
    const m=parse(f);
    const t={id:Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,6),blob:f,name:f.name,title:m.title,artist:m.artist,fav:false,added:Date.now()+i};
    t.url=URL.createObjectURL(f);
    S.tracks.push(t);dbPut(t);
  });
  e.target.value='';render();
};

/* ---------- отрисовка ---------- */
function row(t,i){
  return `<div class="row ${S.cur===t.id?'cur':''}" data-i="${i}"><div class="cv" style="--g:${grad(t)}">${esc((t.title[0]||'♪').toUpperCase())}</div><div class="tx"><b>${esc(t.title)}</b><span>${esc(t.artist||'Неизвестный исполнитель')}</span></div><button class="ib ${t.fav?'on':''}" data-a="fav" data-id="${t.id}" aria-label="В избранное">${t.fav?'♥':'♡'}</button><button class="ib" data-a="more" data-id="${t.id}" aria-label="Ещё">⋯</button></div>`;
}
function render(){
  const t=S.tab,list=$('#list'),bar=$('#plbar');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const pl=S.open&&S.pls.find(p=>p.id===S.open);
  if(S.open&&!pl)S.open=null;
  const tt=$('#ttl');tt.hidden=t==='lib';tt.textContent=t==='fav'?'Избранное':(pl?pl.name:'Плейлисты');
  $('#sr').hidden=t!=='lib';
  bar.hidden=t!=='pl';if(t!=='pl')setBar('','');
  let ids=[],html='';
  if(t==='lib'){
    const q=$('#q').value.trim().toLowerCase();
    ids=S.tracks.slice().sort((a,b)=>b.added-a.added).filter(x=>!q||(x.title+' '+x.artist).toLowerCase().includes(q)).map(x=>x.id);
    if(!S.tracks.length)html='';
    else if(!ids.length)html='<div class="empty">Ничего не найдено.</div>';
  }else if(t==='fav'){
    ids=S.tracks.filter(x=>x.fav).map(x=>x.id);
    if(!ids.length)html='<div class="empty">Нажмите ♡ рядом с песней, и она появится здесь.</div>';
  }else if(!pl){
    setBar('root','<input id="nn" placeholder="Название нового плейлиста"><button class="pill" id="mk">Создать</button>');
    html=S.pls.length?S.pls.map(p=>`<div class="row" data-p="${p.id}"><div class="cv" style="--g:${grad({name:p.name})}">${esc(p.name[0].toUpperCase())}</div><div class="tx"><b>${esc(p.name)}</b><span>Песен: ${p.ids.filter(T).length}</span></div></div>`).join(''):'<div class="empty">Создайте первый плейлист и добавляйте в него песни через меню ⋯</div>';
  }else{
    setBar('open','<button class="pill alt" id="bk">Назад</button><button class="pill" id="ad">Добавить песни</button><button class="pill alt" id="dp">Удалить</button>');
    ids=pl.ids.filter(T);
    if(!ids.length)html='<div class="empty">В плейлисте пока нет песен. Откройте меню ⋯ у песни в библиотеке.</div>';
  }
  S.view=ids;
  list.innerHTML=ids.map((id,i)=>row(T(id),i)).join('')+html;
}
$('#q').oninput=render;
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.t)};
$('#plbar').onclick=e=>{
  const id=e.target.id;
  if(id==='mk')mkPl();
  if(id==='bk'){S.open=null;render()}
  if(id==='ad')pick(S.open);
  if(id==='dp')confirmDel();
};
$('#plbar').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='nn')mkPl()};
function mkPl(){const i=$('#nn');if(!i)return;const v=i.value.trim();if(!v)return;S.pls.push({id:'p'+Date.now(),name:v,ids:[]});savePl();i.value='';render()}
$('#list').onclick=e=>{
  const b=e.target.closest('button');
  if(b){const id=b.dataset.id;if(b.dataset.a==='fav')fav(id);if(b.dataset.a==='more')more(id);return}
  const r=e.target.closest('.row');if(!r)return;
  if(r.dataset.p){S.open=r.dataset.p;render();return}
  play(S.view[+r.dataset.i],S.view);
};
function fav(id){const t=T(id);if(!t)return;t.fav=!t.fav;dbPut(t);render();ui()}

/* ---------- меню ---------- */
function sheet(h){const m=$('#modal');m.innerHTML=`<div class="bk"></div><div class="sh"><div class="gb"></div>${h}</div>`;if(m.hidden){m.hidden=false;pushLayer('modal')}m.querySelector('.bk').onclick=closeModal;return m}
function more(id){
  const t=T(id),m=sheet(`<h2>${esc(t.title)}</h2><button class="opt" data-o="add">В плейлист</button>${S.open?'<button class="opt" data-o="rm">Убрать из плейлиста</button>':''}<button class="opt danger" data-o="del">Удалить из библиотеки</button>`);
  m.onclick=e=>{
    const o=e.target.dataset.o;if(!o)return;
    if(o==='add')return addTo(id);
    if(o==='rm'){const p=S.pls.find(p=>p.id===S.open);p.ids=p.ids.filter(x=>x!==id);savePl()}
    if(o==='del'){
      URL.revokeObjectURL(t.url);dbDel(id);S.tracks=S.tracks.filter(x=>x.id!==id);
      S.queue=S.queue.filter(x=>x!==id);
      if(S.cur===id){au.pause();au.removeAttribute('src');S.cur=null;S.qi=-1}
    }
    closeModal();render();ui();
  };
}
function addTo(id){
  const draw=()=>{
    const m=sheet(`<h2>В плейлист</h2>${S.pls.map(p=>`<button class="opt" data-p="${p.id}"><span>${esc(p.name)}</span><span>${p.ids.includes(id)?'✓':''}</span></button>`).join('')}<div class="nw"><input id="np" placeholder="Новый плейлист"><button class="pill" id="npb">Создать</button></div>`);
    m.onclick=e=>{
      const b=e.target.closest('[data-p]');
      if(b){const p=S.pls.find(p=>p.id===b.dataset.p);p.ids=p.ids.includes(id)?p.ids.filter(x=>x!==id):[...p.ids,id];savePl();draw();render()}
      if(e.target.id==='npb'){const v=$('#np').value.trim();if(!v)return;S.pls.push({id:'p'+Date.now(),name:v,ids:[id]});savePl();draw();render()}
    };
  };
  draw();
}

/* ---------- проигрыватель ---------- */
function play(id,list){
  const t=T(id);if(!t)return;
  if(list)S.queue=list.slice();
  S.qi=S.queue.indexOf(id);S.cur=id;
  au.src=t.url;au.play().catch(()=>{});
  mediaSession(t);ui();render();
}
function step(d,auto){
  if(!S.queue.length)return;
  let n;
  if(S.sh&&S.queue.length>1){do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi)}
  else{
    n=S.qi+d;
    if(n>=S.queue.length){
      if(S.rp===1||!auto)n=0;else{au.pause();au.currentTime=0;return}
    }
    if(n<0)n=S.queue.length-1;
  }
  play(S.queue[n]);
}
const prev=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
const toggle=()=>{if(!S.cur)return;au.paused?au.play().catch(()=>{}):au.pause()};
au.onended=()=>{if(S.rp===2){au.currentTime=0;au.play()}else step(1,true)};
au.onplay=au.onpause=()=>ui();
au.ontimeupdate=()=>{
  const d=au.duration||0;
  $('#mbar').style.width=d?(au.currentTime/d*100)+'%':'0';
  if(!S.drag)$('#seek').value=d?au.currentTime/d*1000:0;
  $('#tc').textContent=fmt(au.currentTime);
};
au.onloadedmetadata=()=>{$('#td').textContent=fmt(au.duration)};
$('#seek').oninput=e=>{S.drag=true;if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#seek').onchange=()=>S.drag=false;
$('#mpp').onclick=$('#fpp').onclick=toggle;
$('#mnx').onclick=$('#bnx').onclick=()=>step(1);
$('#bpv').onclick=prev;
$('#bsh').onclick=()=>{S.sh=!S.sh;ui()};
$('#brp').onclick=()=>{S.rp=(S.rp+1)%3;ui()};
$('#ffav').onclick=()=>S.cur&&fav(S.cur);
$('#fadd').onclick=()=>S.cur&&addTo(S.cur);
$('#mtx').onclick=()=>fullShow(true);
$('#fclose').onclick=()=>fullShow(false);

function ui(){
  const t=T(S.cur);
  $('#mini').hidden=!t;
  if(!t){fullShow(false);return}
  const g=grad(t),ch=(t.title[0]||'♪').toUpperCase();
  $('#mcv').style.setProperty('--g',g);$('#mcv').textContent=ch;
  $('#mt').textContent=t.title;$('#ma').textContent=t.artist||'Неизвестный исполнитель';
  $('#ft').textContent=t.title;$('#fa').textContent=t.artist||'Неизвестный исполнитель';
  $('#disc').style.setProperty('--g',g);$('#dl').textContent=ch;
  const pl=!au.paused;
  $('#disc').classList.toggle('play',pl);
  $('#mpp').innerHTML=$('#fpp').innerHTML=pl?PAUSE:PLAY;
  $('#ffav').textContent=t.fav?'♥':'♡';$('#ffav').classList.toggle('on',t.fav);
  $('#bsh').classList.toggle('on',S.sh);
  $('#brp').classList.toggle('on',S.rp>0);
  $('#brp').textContent=S.rp===2?'①':'⟳';
}
function mediaSession(t){
  if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||''})}catch(e){}
  [['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',prev],['nexttrack',()=>step(1)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}});
}

/* ---------- настройки и фон ---------- */
const G=['linear-gradient(160deg,#ff7aa2,#6a4cff)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#f9d976,#f39f86)','linear-gradient(160deg,#1a1626,#4b2e83)'];
const SET={vol:1,blur:6,dim:45,bg:'none',feed:''};
try{Object.assign(SET,JSON.parse(localStorage.getItem('echo.set')||'{}'))}catch(e){}
let bgUrl=null;
const saveSet=()=>{try{localStorage.setItem('echo.set',JSON.stringify(SET))}catch(e){}};
const layers=[];
function pushLayer(n){try{history.pushState({l:n},'');layers.push(n)}catch(e){}}
function hideLayer(n){
  if(n==='modal')$('#modal').hidden=true;
  if(n==='full'){$('#full').hidden=true;document.body.classList.remove('fp')}
}
function closeLayer(n){
  const i=layers.lastIndexOf(n);
  if(i<0){hideLayer(n);return}
  if(i===layers.length-1)history.back();
  else{layers.splice(i,1);hideLayer(n)}
}
addEventListener('popstate',()=>{const n=layers.pop();if(n)hideLayer(n)});
const closeModal=()=>closeLayer('modal');
const fullShow=v=>{
  if(v){if(!$('#full').hidden)return;$('#full').hidden=false;document.body.classList.add('fp');pushLayer('full')}
  else closeLayer('full');
};
function setBar(m,h){const b=$('#plbar');if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=h}}
const TABS=['lib','pl','fav'];
function go(t,dir){
  if(dir===undefined)dir=Math.sign(TABS.indexOf(t)-TABS.indexOf(S.tab));
  S.tab=t;S.open=null;render();
  const m=$('#main');m.scrollTop=0;
  if(dir){m.classList.remove('s1','s2');void m.offsetWidth;m.classList.add(dir>0?'s1':'s2')}
}
(()=>{
  const m=$('#main');let sx=0,sy=0,ok=false;
  m.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=!e.target.closest('input')},{passive:true});
  m.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
    const d=dx<0?1:-1;
    if(S.tab==='pl'&&S.open&&d<0){S.open=null;render();return}
    const n=TABS.indexOf(S.tab)+d;
    if(n<0||n>=TABS.length)return;
    go(TABS[n],d);
  },{passive:true});
})();
function swipeDown(target,getEl,close,can){
  let y0=null,dy=0;
  target.addEventListener('touchstart',e=>{y0=(e.target.closest('input')||!can(e))?null:e.touches[0].clientY;dy=0},{passive:true});
  target.addEventListener('touchmove',e=>{
    if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);
    const el=getEl();if(el){el.style.transition='none';el.style.transform='translateY('+dy+'px)'}
  },{passive:true});
  target.addEventListener('touchend',e=>{
    if(y0===null)return;
    const c=e.changedTouches&&e.changedTouches[0];if(c)dy=Math.max(dy,c.clientY-y0);
    y0=null;
    const el=getEl();if(el){el.style.transition='transform .2s';el.style.transform=''}
    if(dy>110)close();
  },{passive:true});
}
swipeDown($('#modal'),()=>$('#modal .sh'),closeModal,e=>{const sh=e.target.closest('.sh');return !!sh&&sh.scrollTop===0});
swipeDown($('#full'),()=>$('#full .fin'),()=>fullShow(false),()=>true);
function pick(pid){
  const p=S.pls.find(x=>x.id===pid);if(!p)return;
  const items=S.tracks.slice().sort((a,b)=>b.added-a.added);
  const list=items.length?items.map(t=>`<button class='opt' data-t='${t.id}'><span>${esc(t.title)}${t.artist?' · '+esc(t.artist):''}</span><span class='ck'>${p.ids.includes(t.id)?'✓':''}</span></button>`).join(''):"<p class='nt'>В библиотеке пока нет песен. Сначала добавьте музыку.</p>";
  const m=sheet(`<h2>Добавить в «${esc(p.name)}»</h2>${list}<button class='pill' id='dn' style='margin-top:12px;width:100%'>Готово</button>`);
  m.onclick=e=>{
    if(e.target.id==='dn')return closeModal();
    const b=e.target.closest('[data-t]');if(!b)return;
    const id=b.dataset.t;
    p.ids=p.ids.includes(id)?p.ids.filter(x=>x!==id):[...p.ids,id];
    b.querySelector('.ck').textContent=p.ids.includes(id)?'✓':'';
    savePl();render();
  };
}
function confirmDel(){
  const p=S.pls.find(x=>x.id===S.open);if(!p)return;
  const m=sheet(`<h2>Удалить плейлист «${esc(p.name)}»?</h2><p class='nt'>Песни останутся в библиотеке.</p><button class='opt danger' data-o='y'>Удалить</button><button class='opt' data-o='n'>Отмена</button>`);
  m.onclick=e=>{const o=e.target.dataset.o;if(!o)return;if(o==='y'){S.pls=S.pls.filter(x=>x.id!==p.id);S.open=null;savePl()}closeModal();render()};
}
function applySet(){
  au.volume=SET.vol;$('#vol').value=SET.vol*100;
  const l=$('#bgl');
  l.style.setProperty('--bl',SET.blur+'px');
  l.style.backgroundImage=SET.bg==='img'&&bgUrl?'url('+bgUrl+')':SET.bg[0]==='g'?G[+SET.bg[1]]:'none';
  $('#bgd').style.opacity=SET.dim/100;
}
$('#vol').oninput=e=>{SET.vol=e.target.value/100;au.volume=SET.vol;saveSet()};
$('#setb').onclick=()=>settings();
$('#bgf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(bgUrl)URL.revokeObjectURL(bgUrl);
  bgUrl=URL.createObjectURL(f);SET.bg='img';
  try{db&&db.transaction('t','readwrite').objectStore('t').put({id:'bg',blob:f})}catch(x){}
  e.target.value='';applySet();saveSet();settings();
};
function settings(){
  const m=sheet(`<h2>Настройки</h2><label class='sl'>Громкость<input type='range' id='s1' min='0' max='100' value='${SET.vol*100}'></label><label class='sl'>Размытие фона<input type='range' id='s2' min='0' max='30' value='${SET.blur}'></label><label class='sl'>Затемнение фона<input type='range' id='s3' min='0' max='90' value='${SET.dim}'></label><h2>Фон</h2><div class='gr'>${G.map((g,i)=>`<button class='sw ${SET.bg==='g'+i?'on':''}' data-bg='g${i}' style='background:${g}' aria-label='Фон ${i+1}'></button>`).join('')}<button class='sw ${SET.bg==='none'?'on':''}' data-bg='none' aria-label='Без фона'>∅</button></div><button class='opt' id='bgp'>Выбрать своё фото</button><button class='opt' id='cat'>Каталог дистрибьютора</button><p class='nt'>На iPhone громкость меняется кнопками телефона.</p>`);
  m.oninput=e=>{
    const v=+e.target.value;
    if(e.target.id==='s1'){SET.vol=v/100;$('#vol').value=v}
    if(e.target.id==='s2')SET.blur=v;
    if(e.target.id==='s3')SET.dim=v;
    applySet();saveSet();
  };
  m.onclick=e=>{
    const b=e.target.closest('[data-bg]');
    if(b){SET.bg=b.dataset.bg;applySet();saveSet();settings()}
    if(e.target.id==='bgp')$('#bgf').click();
    if(e.target.id==='cat')catalog();
  };
}

/* ---------- каталог дистрибьютора ---------- */
const isUrl=u=>u.startsWith('https://')||u.startsWith('http://');
const cid=s=>[...String(s)].map(c=>/[a-z0-9-]/i.test(c)?c:'_').join('').slice(-40);
const say=t=>{const p=$('#cm');if(p)p.textContent=t};
function importFeed(j){
  const arr=Array.isArray(j)?j:j.tracks;
  if(!Array.isArray(arr))throw new Error('feed');
  let n=0;
  arr.forEach((x,i)=>{
    const url=String(x.url||x.audio||x.file||'');
    if(!isUrl(url))return;
    const title=String(x.title||x.name||'Без названия');
    const id='r-'+cid(x.id||url);
    if(T(id))return;
    const t={id,remote:true,url,name:title,title,artist:String(x.artist||''),fav:false,added:Date.now()+i};
    S.tracks.push(t);dbPut(t);n++;
  });
  say('Добавлено треков: '+n);render();
}
$('#cfi').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{importFeed(JSON.parse(await f.text()))}catch(x){say('Файл не похож на каталог треков.')}
};
function catalog(){
  const m=sheet(`<h2>Каталог дистрибьютора</h2><p class='nt'>Загрузите ленту треков от дистрибьютора: JSON по ссылке или файлом. Только музыка, на которую у вас есть права.</p><div class='nw'><input id='cu' placeholder='https://…/catalog.json' value='${esc(SET.feed||'')}'><button class='pill' id='cg'>Загрузить</button></div><button class='opt' id='cf'>Открыть файл каталога</button><p class='nt' id='cm'></p>`);
  m.onclick=async e=>{
    if(e.target.id==='cf')$('#cfi').click();
    if(e.target.id==='cg'){
      const u=$('#cu').value.trim();
      if(!isUrl(u))return say('Вставьте ссылку, которая начинается с https://');
      try{const r=await fetch(u);importFeed(await r.json());SET.feed=u;saveSet()}catch(x){say('Не удалось загрузить по ссылке. Откройте файл каталога вручную.')}
    }
  };
}

try{const ic=document.createElement('link');ic.rel='icon';ic.href='data:image/svg+xml,'+encodeURIComponent(new XMLSerializer().serializeToString($('#logo')));document.head.appendChild(ic)}catch(e){}

/* ---------- запуск ---------- */
(async()=>{
  try{db=await idb();const all=await dbAll();
    all.forEach(r=>{if(r.id==='bg'){if(SET.bg==='img')bgUrl=URL.createObjectURL(r.blob);return}if(!r.remote)r.url=URL.createObjectURL(r.blob);S.tracks.push(r)})}catch(e){db=null}
  if(SET.bg==='img'&&!bgUrl)SET.bg='none';
  applySet();
  render();ui();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
